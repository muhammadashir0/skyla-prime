[project]
name = "skyla-prime"
version = "0.1.0"
description = "SKYLA PRIME — independent frontier intelligence and autonomous operations platform"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "httpx>=0.27",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23"]
pdf = ["pypdf>=4.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["skyla*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
